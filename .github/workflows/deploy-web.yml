name: Deploy Headshot Lab Web App
on:
  push:
    branches: [main]
    paths: ['dist/**', 'firebase.json']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --global firebase-tools
      - run: firebase deploy --only hosting --project headshot-lab-1d8c5
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
